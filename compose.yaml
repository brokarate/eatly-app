services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meal}
      POSTGRES_USER: ${POSTGRES_USER:-meal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meal_local}
    volumes:
      - meal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-meal}
      PGUSER: ${POSTGRES_USER:-meal}
      PGPASSWORD: ${POSTGRES_PASSWORD:-meal_local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20
    command: sh -c 'alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0'
volumes:
  meal_pg:
